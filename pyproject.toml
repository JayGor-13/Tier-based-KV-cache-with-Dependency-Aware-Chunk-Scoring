[build-system]
requires = ["setuptools>=80.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tdc-kv"
version = "0.1.0"
description = "Tier-based KV-cache eviction with dependency-aware chunk scoring."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "torch>=2.1,<3",
    "transformers>=4.43,<6",
    "datasets>=5.0.1",
    "accelerate>=1.14.0",
    "numpy>=2.5.1",
    "scipy>=1.18.0",
    "matplotlib>=3.11.1",
]

[project.optional-dependencies]
dev = ["pytest>=9.1.1"]

[tool.setuptools.packages.find]
include = ["src*", "benchmarks*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=80.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tdc-kv"
version = "0.1.0"
description = "Tier-based KV-cache eviction with dependency-aware chunk scoring."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "torch>=2.1,<3",
    "transformers>=4.43,<6",
    "datasets>=5.0,<6",
    "accelerate>=1.14,<2",
    "huggingface-hub>=0.36,<1",
    "numpy>=2.4,<3",
    "scipy>=1.17,<2",
    "matplotlib>=3.11,<4",
]

[project.optional-dependencies]
dev = ["pytest>=9.1,<10"]

[tool.setuptools.packages.find]
include = ["src*", "benchmarks*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
